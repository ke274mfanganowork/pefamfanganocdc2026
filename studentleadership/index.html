<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Official Update: Ke274 Voting System Has Moved</title>
  <meta name="description" content="ISAAC Voting has moved to a new official online location.">
  
  <!-- Premium Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='50' font-weight='bold' fill='url(%23grad)' text-anchor='middle'>I</text><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23287BFF'/><stop offset='100%25' stop-color='%23ff0080'/></linearGradient></defs></svg>">
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. CORE RESET & BASE
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100svh; /* Dynamic viewport height for mobile */
      min-height: 100dvh;
      width: 100%;
      overflow: hidden; /* Strict single-screen constraint */
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       2. CINEMATIC RAINBOW GRADIENT BACKGROUND
       ========================================= */
    .bg-rainbow {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(
        -45deg, 
        #0f172a, /* Deep midnight blue */
        #1e1b4b, /* Royal purple */
        #4c1d95, /* Deep purple */
        #be185d, /* Magenta */
        #c2410c, /* Coral */
        #ca8a04, /* Golden yellow */
        #0d9488, /* Turquoise */
        #287BFF, /* Electric blue */
        #0f172a  /* Deep midnight blue */
      );
      background-size: 400% 400%;
      animation: gradient-flow 20s ease infinite;
    }

    @keyframes gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Luminous Orbs for Atmospheric Depth */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      z-index: 1;
      animation: float-orb 25s infinite ease-in-out;
    }

    .orb-1 {
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, #287BFF 0%, transparent 70%);
      top: -20%;
      left: -10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, #ff0080 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, #ca8a04 0%, transparent 70%);
      top: 40%;
      left: 30%;
      animation-delay: -10s;
      opacity: 0.2;
    }

    @keyframes float-orb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* =========================================
       3. GLASSMORPHISM CENTRAL PANEL
       ========================================= */
    .main-container {
      position: relative;
      z-index: 10;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .glass-card {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: clamp(2rem, 5vw, 3.5rem);
      text-align: center;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      animation: card-reveal 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes card-reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       4. TYPOGRAPHY & CONTENT
       ========================================= */
    .announcement-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1rem;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .announcement-label::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #287BFF;
      border-radius: 50%;
      box-shadow: 0 0 8px #287BFF;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .subtext {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* =========================================
       5. PREMIUM ILLUSTRATION (SVG)
       ========================================= */
    .illustration-container {
      margin: 0 auto 2rem;
      width: 120px;
      height: 120px;
      position: relative;
    }

    .illustration-container svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(40, 123, 255, 0.3));
    }

    /* =========================================
       6. DOMINANT CTA BUTTON
       ========================================= */
    .btn-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 400px;
      padding: 1.1rem 2rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #287BFF 0%, #7928ca 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(40, 123, 255, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .btn-portal::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }

    .btn-portal:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(121, 40, 202, 0.4);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-portal:hover::before {
      left: 100%;
    }

    .btn-portal:active {
      transform: translateY(-1px);
    }

    .btn-portal:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    .arrow {
      transition: transform 0.3s ease;
    }

    .btn-portal:hover .arrow {
      transform: translateX(6px);
    }

    /* =========================================
       7. RESPONSIVE & ACCESSIBILITY
       ========================================= */
    @media (max-width: 480px) {
      .glass-card {
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }
      
      .illustration-container {
        width: 100px;
        height: 100px;
        margin-bottom: 1.5rem;
      }
      
      .btn-portal {
        padding: 1rem 1.5rem;
        font-size: 1rem;
      }
    }

    /* Respect Reduced Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      .bg-rainbow {
        animation: none;
        background-size: 100% 100%;
        background-position: center;
      }
      
      .orb, .announcement-label::before {
        animation: none;
      }
      
      .glass-card {
        animation: none;
        opacity: 1;
        transform: none;
      }
      
      .btn-portal::before {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background Layers -->
  <div class="bg-rainbow"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Single-Screen Central Composition -->
  <main class="main-container">
    <div class="glass-card">
      
      <!-- Premium Animated Illustration -->
      <div class="illustration-container">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer rotating glow ring -->
          <circle cx="60" cy="60" r="52" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
            <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="15s" repeatCount="indefinite"/>
          </circle>
          
          <!-- Inner solid ring -->
          <circle cx="60" cy="60" r="38" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" opacity="0.9"/>
          
          <!-- Traveling particle -->
          <circle cx="60" cy="8" r="5" fill="#ffffff" filter="url(#glow)">
            <animateMotion dur="4s" repeatCount="indefinite" path="M 60,8 A 52,52 0 1,1 59.9,8" />
          </circle>
          
          <!-- Center secure checkmark -->
          <path d="M 46 60 L 56 70 L 76 50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
          
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#287BFF" />
              <stop offset="50%" stop-color="#ff0080" />
              <stop offset="100%" stop-color="#ca8a04" />
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
        </svg>
      </div>

      <!-- Core Message -->
      <div class="announcement-label">Official Announcement</div>
      
      <h1 class="headline">WE HAVE MOVED!</h1>
      
      <p class="subtext">
        ISAAC Voting has moved to a new location.<br>
        Please visit our new voting portal using the button below.
      </p>

      <!-- Dominant Destination Button -->
      <a href="https://ke274mfanganowork.github.io/ke274-voting-system-2026/" class="btn-portal">
        VISIT OUR NEW VOTING PORTAL 
        <span class="arrow">→</span>
      </a>

    </div>
  </main>

</body>
</html>
